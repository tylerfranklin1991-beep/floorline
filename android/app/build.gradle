apply plugin: 'com.android.application'

// Release signing is read from a file OUTSIDE the repo (never committed).
// Default: /home/box/floorline-release/keystore.properties, override with FLOORLINE_KEYSTORE_PROPS.
def releasePropsFile = file(System.getenv("FLOORLINE_KEYSTORE_PROPS") ?: "/home/box/floorline-release/keystore.properties")
def releaseProps = new Properties()
if (releasePropsFile.exists()) { releasePropsFile.withInputStream { releaseProps.load(it) } }

android {
    namespace "com.tylerfranklin.floorline.beta"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tylerfranklin.floorline"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "0.9.0-beta.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseProps["storeFile"]) {
                storeFile file(releaseProps["storeFile"])
                storePassword releaseProps["storePassword"]
                keyAlias releaseProps["keyAlias"]
                keyPassword releaseProps["keyPassword"]
            }
        }
    }
    buildTypes {
        debug {
            // Side-loaded field beta keeps its own id/name so it installs next to the Play build.
            applicationIdSuffix ".beta"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Floorline Beta"
            resValue "string", "title_activity_main", "Floorline Beta"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Floorline"
            resValue "string", "title_activity_main", "Floorline"
            if (releaseProps["storeFile"]) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // On-device handwriting/print OCR for "Auto from sketch" (bundled model, works offline).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Pro unlock (off by default in the web layer, see src/lib/field/pro.ts).
    implementation 'com.android.billingclient:billing:9.1.0'
    // Optional Play In-App Review prompt.
    implementation 'com.google.android.play:review:2.0.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
